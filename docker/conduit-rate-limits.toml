# Echo Server - baked Conduit config (no secrets; safe to commit).
# Loaded via CONDUIT_CONFIG=/app/conduit.toml in the Docker image.
# Env vars (CONDUIT_*) still override anything set here.

# ── Retention ────────────────────────────────────────────────────────────────
# Messages (timeline events) older than this are redacted automatically once a
# day: their content is erased from the database while room state (membership,
# power levels, ...) is preserved. Set to 0 or unset to keep everything.
[global]
message_retention = "60days"

# Media not accessed for 60 days is deleted. Total media is additionally
# capped at 3 GB (oldest-accessed purged first on upload) so the server stays
# inside Turso's free 5 GB storage quota with headroom for the chat database.
[[global.media.retention]]
accessed = "60days"
space = "3 GB"

[[global.media.retention]]
scope = "remote"
accessed = "60days"

[[global.media.retention]]
scope = "thumbnail"
accessed = "60days"

# ── Rate limiting ────────────────────────────────────────────────────────────
# Conduit's limiter has no "disable" switch: every value must be non-zero.
# Instead, each limit is set so high it can never be reached in practice:
# per_second = 100000 advances the bucket by 10 microseconds per request and
# burst_capacity = 100000 allows 100k requests instantly.
#
# Bucket semantics (conduit/src/service/rate_limiting/mod.rs):
#   client.global = ONE server-wide bucket per restriction (shared by all users)
#   client.target = one bucket per user (authentication_failures is per IP)
# Both scopes are set to effectively-unlimited below.
#
# `inherits = "public_large"` is chosen for its authentication_failures
# limiter, which cannot be overridden via TOML: the flattened shadow schema
# feeds unknown keys to the restriction map first, so an `authentication_failures`
# key fails to parse as a ClientRestriction variant (see conduit-config/tests/rate_limiting_overrides.rs).
# The fork raised the public_large default from upstream's 1 failed login per
# minute (burst 20, per IP) to 600 per minute (burst 600), because the old
# value let a client retrying with a stale access token lock its own IP out
# of the server. Every other public_large value is either overridden below or
# federation-only, and federation is disabled on this server.

[global.rate_limiting]
inherits = "public_large"

[global.rate_limiting.client.global]
registration = { per_second = 100000, burst_capacity = 100000 }
login = { per_second = 100000, burst_capacity = 100000 }
registration_token_validity = { per_second = 100000, burst_capacity = 100000 }
send_event = { per_second = 100000, burst_capacity = 100000 }
join = { per_second = 100000, burst_capacity = 100000 }
knock = { per_second = 100000, burst_capacity = 100000 }
invite = { per_second = 100000, burst_capacity = 100000 }
send_report = { per_second = 100000, burst_capacity = 100000 }
create_alias = { per_second = 100000, burst_capacity = 100000 }
media_download = { per_second = 100000, burst_capacity = 100000 }
media_create = { per_second = 100000, burst_capacity = 100000 }

# Media bandwidth is counted in bytes, not requests; raised to match above.
[global.rate_limiting.client.global.media]
download = { per_second = "10 GB", burst_capacity = "100 GB" }
upload = { per_second = "10 GB", burst_capacity = "100 GB" }
fetch = { per_second = "10 GB", burst_capacity = "100 GB" }

[global.rate_limiting.client.target]
registration = { per_second = 100000, burst_capacity = 100000 }
login = { per_second = 100000, burst_capacity = 100000 }
registration_token_validity = { per_second = 100000, burst_capacity = 100000 }
send_event = { per_second = 100000, burst_capacity = 100000 }
join = { per_second = 100000, burst_capacity = 100000 }
knock = { per_second = 100000, burst_capacity = 100000 }
invite = { per_second = 100000, burst_capacity = 100000 }
send_report = { per_second = 100000, burst_capacity = 100000 }
create_alias = { per_second = 100000, burst_capacity = 100000 }
media_download = { per_second = 100000, burst_capacity = 100000 }
media_create = { per_second = 100000, burst_capacity = 100000 }

[global.rate_limiting.client.target.media]
download = { per_second = "10 GB", burst_capacity = "100 GB" }
upload = { per_second = "10 GB", burst_capacity = "100 GB" }
fetch = { per_second = "10 GB", burst_capacity = "100 GB" }

# Federation: left at preset defaults. This empty table is required by the
# config schema (the rate_limiting client/federation keys are mandatory).
[global.rate_limiting.federation]
