# Echo Server - baked Conduit config (no secrets; safe to commit).
# Loaded via CONDUIT_CONFIG=/app/conduit.toml in the Docker image.
# Env vars (CONDUIT_*) still override anything set here.

[global.rate_limiting]
# private_medium preset: auth-failure limiter 10/hour (burst 20) instead of
# private_small's 1/hour, which caused lockouts on phone clients.
inherits = "private_medium"

# Global (per-IP) client limits — bumped for login lockout and message/push throughput.
[global.rate_limiting.client.global]
login = { per_hour = 100, burst_capacity = 50 }
send_event = { per_second = 10, burst_capacity = 100 }

# Federation limits intentionally left at preset defaults (federation is disabled
# anyway); this empty table is required by the config schema.
# NOTE: `authentication_failures` cannot be overridden via TOML in this fork
# (schema limitation), so we rely on the private_medium preset for it.
[global.rate_limiting.federation]
